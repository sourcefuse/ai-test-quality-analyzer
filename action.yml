    - name: Extract analysis paths
      id: extract_paths
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"

        # Use ANALYSIS_FOLDER from environment (set in 'Set analysis path' step)
        if [ -z "$ANALYSIS_FOLDER" ]; then
          echo "❌ Analysis folder not found (ANALYSIS_FOLDER env not set)"
          exit 1
        fi

        if [ ! -d "$ANALYSIS_FOLDER" ]; then
          echo "❌ Analysis folder does not exist: $ANALYSIS_FOLDER"
          echo "📂 Listing available folders..."
          ls -la
          exit 1
        fi

        echo "analysis_path=$ANALYSIS_FOLDER" >> $GITHUB_OUTPUT
        echo "requirements_file=$ANALYSIS_FOLDER/Requirements.md" >> $GITHUB_OUTPUT

        # Find result file (could be AnalysisReport.md or AnalysisReport_*.md)
        RESULT_FILE=$(find "$ANALYSIS_FOLDER" -name "AnalysisReport*.md" -type f | head -1)
        echo "result_file=$RESULT_FILE" >> $GITHUB_OUTPUT

        echo "📁 Analysis folder: $ANALYSIS_FOLDER"
        echo "📄 Requirements file: $ANALYSIS_FOLDER/Requirements.md"
        echo "📊 Result file: $RESULT_FILE"

    - name: Extract test quality score
      id: extract_score
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        ACTION_PATH: ${{ github.action_path }}
        INPUT_RESULT_FILE: ${{ steps.extract_paths.outputs.result_file }}
      run: |
        cd "$ACTION_PATH"
        # ✅ SAFE: Validate file path doesn't contain malicious characters
        RESULT_FILE=$(echo "$INPUT_RESULT_FILE" | tr -cd 'A-Za-z0-9._/-')

        if [ ! -f "$RESULT_FILE" ]; then
          echo "❌ Result file not found: $RESULT_FILE"
          exit 1
        fi

        # Method 1: Extract from header "**Total Score:** X.X/10"
        SCORE=$(grep -E "^\*\*Total Score:\*\*" "$RESULT_FILE" | head -1 | grep -oE "[0-9]+\.[0-9]+" | head -1)

        # Method 2: If not found, try from Score Calculation table (TOTAL row)
        if [ -z "$SCORE" ]; then
          echo "   Trying Score Calculation table..."
          SCORE=$(grep -E "^\| \*\*TOTAL\*\*" "$RESULT_FILE" | grep -oE "[0-9]+\.[0-9]+" | head -1)
        fi

        # Method 3: If still not found, try any "Total Score:" pattern
        if [ -z "$SCORE" ]; then
          echo "   Trying generic Total Score pattern..."
          SCORE=$(grep -iE "total score.*[0-9]" "$RESULT_FILE" | grep -oE "[0-9]+\.?[0-9]*" | head -1)
        fi

        # Validate score
        if [ -z "$SCORE" ]; then
          echo "❌ Could not extract score from result file"
          echo "   Please check the AnalysisReport.md format"
          exit 1
        fi

        # Validate score is within range (0-10)
        VALID=$(awk -v score="$SCORE" 'BEGIN { print (score >= 0 && score <= 10) ? "true" : "false" }')
        if [ "$VALID" != "true" ]; then
          echo "⚠️  Score $SCORE is outside valid range (0-10), capping..."
          SCORE=$(awk -v score="$SCORE" 'BEGIN { if (score > 10) print 10; else if (score < 0) print 0; else print score }')
        fi

        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "📊 Test Quality Score: $SCORE/10"

    - name: Check score threshold
      id: check_score
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        INPUT_SCORE: ${{ steps.extract_score.outputs.score }}
        INPUT_THRESHOLD: ${{ inputs.minimum_score }}
      run: |
        # ✅ SAFE: Validate score is a number (only digits and decimal point)
        SCORE=$(echo "$INPUT_SCORE" | tr -cd '0-9.')
        THRESHOLD=$(echo "$INPUT_THRESHOLD" | tr -cd '0-9.')

        # Compare scores using awk (more portable than bc)
        PASSED=$(awk -v score="$SCORE" -v threshold="$THRESHOLD" 'BEGIN { print (score >= threshold) ? "true" : "false" }')

        echo "passed=$PASSED" >> $GITHUB_OUTPUT

        if [ "$PASSED" = "true" ]; then
          echo "✅ Test quality score ($SCORE) meets minimum threshold ($THRESHOLD)"
        else
          echo "⚠️  Test quality score ($SCORE) is below minimum threshold ($THRESHOLD)"
        fi

    - name: Step 4 - Upload to Confluence
      id: upload_confluence
      if: inputs.upload_to_confluence == 'true'
      shell: bash
      env:
        TEST_QUALITY_SCORE: ${{ steps.extract_score.outputs.score }}
        MINIMUM_SCORE_THRESHOLD: ${{ inputs.minimum_score }}
        SCORE_PASSED: ${{ steps.check_score.outputs.passed }}
      run: |
        cd ${{ github.action_path }}
        echo "📤 Uploading results to Confluence..."
        echo "   Score: ${TEST_QUALITY_SCORE}/10 (Threshold: ${MINIMUM_SCORE_THRESHOLD})"
        OUTPUT=$(pnpm run upload-requirements 2>&1)
        echo "$OUTPUT"

        # Extract Confluence URL from output
        CONFLUENCE_URL="${{ inputs.confluence_url }}/wiki$(echo "$OUTPUT" | grep -oP 'URL: \K.*' | head -1)"

        if [ -n "$CONFLUENCE_URL" ]; then
          echo "confluence_url=$CONFLUENCE_URL" >> $GITHUB_OUTPUT
          echo "✅ Results uploaded to Confluence: $CONFLUENCE_URL"
        else
          echo "confluence_url=" >> $GITHUB_OUTPUT
          echo "✅ Results uploaded to Confluence"
        fi

    - name: Report to Backstage Test Quality Tracker
      if: always()
      shell: bash
      env:
        TEST_QUALITY_SCORE: ${{ steps.extract_score.outputs.score }}
        SCORE_PASSED: ${{ steps.check_score.outputs.passed }}
        MINIMUM_SCORE: ${{ inputs.minimum_score }}
        AI_TYPE: ${{ inputs.ai_type }}
        AWS_BEDROCK_MODEL: ${{ inputs.aws_bedrock_model }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        BEDROCK_COST: ${{ steps.bedrock_analysis.outputs.total_cost }}
        GLM_COST: ${{ steps.glm_analysis.outputs.total_cost }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        REPO_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        BRANCH_NAME: ${{ github.head_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_CREATOR: ${{ github.event.pull_request.user.login }}
        RUN_TIMESTAMP: ${{ github.event.created_at }}
      run: |
        echo "📊 Reporting test quality metrics to Backstage..."

        # Determine model name and provider based on ai_type
        if [ "$AI_TYPE" == "1" ] || [ -z "$AI_TYPE" ]; then
          MODEL_NAME="${AWS_BEDROCK_MODEL:-us.anthropic.claude-3-5-sonnet-20241022-v2:0}"
          AI_PROVIDER="aws_bedrock"
          ACTUAL_COST="${BEDROCK_COST:-0}"
        else
          MODEL_NAME="${ANTHROPIC_MODEL:-sonnet[1m]}"
          AI_PROVIDER="glm"
          ACTUAL_COST="${GLM_COST:-0}"
        fi

        # Use actual cost from analysis steps (defaults to 0 if not available)
        TOTAL_COST="${ACTUAL_COST:-0}"
        echo "💰 Total AI Cost: \$$TOTAL_COST"

        # Send data to Backstage (|| true ensures this doesn't fail the workflow)
        curl -X POST https://sf-portal.sourcef.us/api/test-quality-tracker/record \
          -H "Content-Type: application/json" \
          -d '{
            "repo_name": "'"$REPO_NAME"'",
            "runner_id": "'"$RUN_ID"'",
            "workflow_run_number": '"${RUN_NUMBER:-0}"',
            "jira_ticket_id": "'"$JIRA_TICKET_ID"'",
            "quality_score": '"${TEST_QUALITY_SCORE:-0}"',
            "score_passed": '"${SCORE_PASSED:-false}"',
            "minimum_score": '"${MINIMUM_SCORE:-6.0}"',
            "model_name": "'"$MODEL_NAME"'",
            "ai_provider": "'"$AI_PROVIDER"'",
            "aws_cost": '"${TOTAL_COST}"',
            "confluence_url": "'"$CONFLUENCE_URL"'",
            "branch_name": "'"$BRANCH_NAME"'",
            "pr_number": '"${PR_NUMBER:-0}"',
            "pr_creator": "'"${PR_CREATOR:-unknown}"'",
            "run_timestamp": "'"${RUN_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"'"
          }' \
          --max-time 10 \
          --silent \
          --show-error \
          || echo "⚠️  Failed to report to Backstage (non-critical, continuing...)"

        echo "✅ Backstage reporting completed (or skipped if unavailable)"

    - name: Generate summary
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        ACTION_PATH: ${{ github.action_path }}
        INPUT_SCORE: ${{ steps.extract_score.outputs.score }}
        INPUT_THRESHOLD: ${{ inputs.minimum_score }}
        INPUT_PASSED: ${{ steps.check_score.outputs.passed }}
        INPUT_RESULT_FILE: ${{ steps.extract_paths.outputs.result_file }}
        INPUT_CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        INPUT_JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        INPUT_REQUIREMENTS_FILE: ${{ steps.extract_paths.outputs.requirements_file }}
        PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        cd "$ACTION_PATH"
        # ✅ SAFE: Sanitize all inputs
        SCORE=$(echo "$INPUT_SCORE" | tr -cd '0-9.')
        THRESHOLD=$(echo "$INPUT_THRESHOLD" | tr -cd '0-9.')
        PASSED=$(echo "$INPUT_PASSED" | tr -cd 'a-z')
        RESULT_FILE=$(echo "$INPUT_RESULT_FILE" | tr -cd 'A-Za-z0-9._/-')
        CONFLUENCE_URL=$(echo "$INPUT_CONFLUENCE_URL" | tr -cd 'A-Za-z0-9._/:?&=-')
        JIRA_TICKET_ID=$(echo "$INPUT_JIRA_TICKET_ID" | tr -cd 'A-Za-z0-9_-')
        REQUIREMENTS_FILE=$(echo "$INPUT_REQUIREMENTS_FILE" | tr -cd 'A-Za-z0-9._/-')
        SAFE_PR_URL=$(echo "$PR_HTML_URL" | tr -cd 'A-Za-z0-9._/:?&=-')
        SAFE_PR_NUMBER=$(echo "$PR_NUMBER" | tr -cd '0-9')

        echo "## 📊 Unit Test Quality Analysis Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**JIRA Ticket:** $JIRA_TICKET_ID" >> $GITHUB_STEP_SUMMARY
        echo "**Test Quality Score:** ${SCORE}/10" >> $GITHUB_STEP_SUMMARY
        echo "**Minimum Threshold:** ${THRESHOLD}/10" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$PASSED" = "true" ]; then
          echo "✅ **Status:** PASSED - Score meets minimum threshold" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️  **Status:** BELOW THRESHOLD - Additional test coverage needed" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY

        # Add PR link if available (using sanitized env vars)
        if [ -n "$SAFE_PR_URL" ]; then
          echo "- **Pull Request:** [${SAFE_PR_NUMBER}](${SAFE_PR_URL})" >> $GITHUB_STEP_SUMMARY
        fi

        echo "### 📁 Generated Files" >> $GITHUB_STEP_SUMMARY
        echo "- Requirements: \`$REQUIREMENTS_FILE\`" >> $GITHUB_STEP_SUMMARY
        echo "- Analysis Report: \`$RESULT_FILE\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Extract detailed score breakdown from result file
        echo "### 📈 Detailed Score Breakdown" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Extract Test Coverage section
        if grep -q "## Test Coverage Analysis" "$RESULT_FILE"; then
          echo "#### 1. Test Coverage" >> $GITHUB_STEP_SUMMARY
          COVERAGE_SCORE=$(grep "## Test Coverage Analysis" "$RESULT_FILE" | grep -oE "\([0-9.]+/[0-9.]+ points\)" | head -1)
          echo "**Score:** $COVERAGE_SCORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Extract key points (lines starting with - under this section until next ##)
          sed -n '/## Test Coverage Analysis/,/^## /p' "$RESULT_FILE" | grep "^- " | head -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract Test Quality section
        if grep -q "## Test Quality Assessment" "$RESULT_FILE"; then
          echo "#### 2. Test Quality" >> $GITHUB_STEP_SUMMARY
          QUALITY_SCORE=$(grep "## Test Quality Assessment" "$RESULT_FILE" | grep -oE "\([0-9.]+/[0-9.]+ points\)" | head -1)
          echo "**Score:** $QUALITY_SCORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/## Test Quality Assessment/,/^## /p' "$RESULT_FILE" | grep "^- " | head -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract Edge Cases section
        if grep -q "## Edge Cases & Error Scenarios" "$RESULT_FILE"; then
          echo "#### 3. Edge Cases & Error Scenarios" >> $GITHUB_STEP_SUMMARY
          EDGE_SCORE=$(grep "## Edge Cases & Error Scenarios" "$RESULT_FILE" | grep -oE "\([0-9.]+/[0-9.]+ points\)" | head -1)
          echo "**Score:** $EDGE_SCORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/## Edge Cases & Error Scenarios/,/^## /p' "$RESULT_FILE" | grep "^- " | head -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract Test Assertions section
        if grep -q "## Test Assertions Quality" "$RESULT_FILE"; then
          echo "#### 4. Test Assertions" >> $GITHUB_STEP_SUMMARY
          ASSERTIONS_SCORE=$(grep "## Test Assertions Quality" "$RESULT_FILE" | grep -oE "\([0-9.]+/[0-9.]+ points\)" | head -1)
          echo "**Score:** $ASSERTIONS_SCORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/## Test Assertions Quality/,/^## /p' "$RESULT_FILE" | grep "^- " | head -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract Code Organization section
        if grep -q "## Code Organization & Maintainability" "$RESULT_FILE"; then
          echo "#### 5. Code Organization & Maintainability" >> $GITHUB_STEP_SUMMARY
          ORG_SCORE=$(grep "## Code Organization & Maintainability" "$RESULT_FILE" | grep -oE "\([0-9.]+/[0-9.]+ points\)" | head -1)
          echo "**Score:** $ORG_SCORE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/## Code Organization & Maintainability/,/^## /p' "$RESULT_FILE" | grep "^- " | head -5 >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        # Extract Critical Gaps or Main Issues if available
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if grep -q "### Critical Gaps\|### Main Issues\|### Weaknesses" "$RESULT_FILE"; then
          echo "### ⚠️  Critical Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Try to extract from different possible section names
          sed -n '/### Critical Gaps/,/^## /p' "$RESULT_FILE" | grep "^- \|^[0-9]\." | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || \
          sed -n '/### Main Issues/,/^## /p' "$RESULT_FILE" | grep "^- \|^[0-9]\." | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null || \
          sed -n '/### Weaknesses/,/^## /p' "$RESULT_FILE" | grep "^- \|^[0-9]\." | head -10 >> $GITHUB_STEP_SUMMARY 2>/dev/null
          echo "" >> $GITHUB_STEP_SUMMARY
        fi

        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📄 **Full detailed report available in job artifacts**" >> $GITHUB_STEP_SUMMARY

    - name: Fail if score below threshold
      if: steps.check_score.outputs.passed == 'false'
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        INPUT_SCORE: ${{ steps.extract_score.outputs.score }}
        INPUT_THRESHOLD: ${{ inputs.minimum_score }}
      run: |
        # ✅ SAFE: Validate score is a number (only digits and decimal point)
        SCORE=$(echo "$INPUT_SCORE" | tr -cd '0-9.')
        THRESHOLD=$(echo "$INPUT_THRESHOLD" | tr -cd '0-9.')

        GAP=$(awk -v threshold="$THRESHOLD" -v score="$SCORE" 'BEGIN { printf "%.1f", threshold - score }')

        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "❌ TEST QUALITY CHECK FAILED"
        echo "════════════════════════════════════════════════════════════"
        echo ""
        echo "📊 Score: ${SCORE}/10"
        echo "🎯 Required: ${THRESHOLD}/10"
        echo "📉 Gap: ${GAP} points"
        echo ""
        echo "⚠️  This PR cannot be merged until test quality improves."
        echo ""
        echo "📋 Next Steps:"
        echo "  1. Review the analysis report in GitHub Actions artifacts"
        echo "  2. Check Confluence for detailed feedback"
        echo "  3. Add missing test coverage (especially error scenarios)"
        echo "  4. Ensure test quality meets minimum standards"
        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo ""

        # Use GitHub Actions warning annotation (not error, so workflow continues)
        echo "::warning::Test quality score (${SCORE}/10) is below minimum threshold (${THRESHOLD}/10). Gap: ${GAP} points. This PR requires additional test coverage before it can be merged."

        # DO NOT exit 1 - allow workflow to continue and report to Backstage

    - name: Report Failure to Backstage Test Quality Tracker
      if: failure()
      shell: bash
      env:
        TEST_QUALITY_SCORE: ${{ steps.extract_score.outputs.score }}
        SCORE_PASSED: 'false'
        MINIMUM_SCORE: ${{ inputs.minimum_score }}
        AI_TYPE: ${{ inputs.ai_type }}
        AWS_BEDROCK_MODEL: ${{ inputs.aws_bedrock_model }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        BEDROCK_COST: ${{ steps.bedrock_analysis.outputs.total_cost }}
        GLM_COST: ${{ steps.glm_analysis.outputs.total_cost }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        REPO_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        BRANCH_NAME: ${{ github.head_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_CREATOR: ${{ github.event.pull_request.user.login }}
        RUN_TIMESTAMP: ${{ github.event.created_at }}
        JOB_STATUS: ${{ job.status }}
      run: |
        echo "📊 Reporting workflow failure to Backstage..."

        # Determine model name and provider based on ai_type
        if [ "$AI_TYPE" == "1" ] || [ -z "$AI_TYPE" ]; then
          MODEL_NAME="${AWS_BEDROCK_MODEL:-us.anthropic.claude-3-5-sonnet-20241022-v2:0}"
          AI_PROVIDER="aws_bedrock"
          ACTUAL_COST="${BEDROCK_COST:-0}"
        else
          MODEL_NAME="${ANTHROPIC_MODEL:-sonnet[1m]}"
          AI_PROVIDER="glm"
          ACTUAL_COST="${GLM_COST:-0}"
        fi

        # On error, send blank values for optional fields (not 0, but empty string)
        TOTAL_COST=""
        QUALITY_SCORE=""
        CONFLUENCE_URL=""

        # Determine error message based on what failed
        echo "🔍 DEBUG: Determining error source..."

        # Priority 1: Use captured error from error files (most specific)
        if [ -f "/tmp/workflow_error_message.txt" ]; then
          ERROR_MSG=$(cat /tmp/workflow_error_message.txt)
          ERROR_STEP=$(cat /tmp/workflow_error_step.txt 2>/dev/null || echo "analysis")
          echo "🔍 DEBUG: Using captured error from file"
          echo "🔍 DEBUG: Error Step = $ERROR_STEP"
          echo "🔍 DEBUG: Error Message = $ERROR_MSG"
        # Priority 2: Configuration validation failure
        elif [ "${{ steps.validate_config.outcome }}" == "failure" ]; then
          MISSING_FIELDS="${VALIDATION_MISSING_FIELDS:-unknown}"
          ERROR_MSG="Configuration validation failed - missing required parameters: ${MISSING_FIELDS}. Check workflow secrets and inputs."
          ERROR_STEP="validation"
          echo "🔍 DEBUG: Using validation failure error"
        # Priority 3: No score generated (generic fallback)
        elif [ -z "$TEST_QUALITY_SCORE" ] || [ "$TEST_QUALITY_SCORE" == "" ]; then
          ERROR_MSG="Workflow failed during analysis - no quality score generated. Check logs for details."
          ERROR_STEP="analysis"
          echo "🔍 DEBUG: Using generic fallback (no score)"
        # Priority 4: Score below threshold
        else
          ERROR_MSG="Test quality score (${TEST_QUALITY_SCORE}/10) below threshold (${MINIMUM_SCORE}/10)"
          ERROR_STEP="quality_check"
          echo "🔍 DEBUG: Using score below threshold error"
        fi

        echo ""
        echo "⚠️  Error: $ERROR_MSG"
        echo "💰 Total AI Cost: (blank on error)"
        echo ""

        # Simple escaping for plain text: only escape quotes for JSON string safety
        ERROR_MSG_SAFE=$(echo "$ERROR_MSG" | sed 's/"/\\"/g' | tr '\n' ' ' | tr '\t' ' ')
        echo "🔍 DEBUG: Sending to Backstage:"
        echo "   error_message: $ERROR_MSG_SAFE"
        echo "   error_step: $ERROR_STEP"
        echo "   quality_score: (blank)"
        echo "   confluence_url: (blank)"
        echo "   aws_cost: (blank)"
        echo ""

        # Send error data to Backstage (|| true ensures this doesn't fail the workflow)
        # On error: quality_score, confluence_url, and aws_cost are sent as empty strings (blank)
        echo "🔍 DEBUG: Sending POST to Backstage API..."
        BACKSTAGE_RESPONSE=$(curl -X POST https://sf-portal.sourcef.us/api/test-quality-tracker/record \
          -H "Content-Type: application/json" \
          -d '{
            "repo_name": "'"$REPO_NAME"'",
            "runner_id": "'"$RUN_ID"'",
            "workflow_run_number": '"${RUN_NUMBER:-0}"',
            "jira_ticket_id": "'"$JIRA_TICKET_ID"'",
            "quality_score": "'"$QUALITY_SCORE"'",
            "score_passed": false,
            "minimum_score": '"${MINIMUM_SCORE:-6.0}"',
            "model_name": "'"$MODEL_NAME"'",
            "ai_provider": "'"$AI_PROVIDER"'",
            "aws_cost": "'"$TOTAL_COST"'",
            "confluence_url": "'"$CONFLUENCE_URL"'",
            "branch_name": "'"$BRANCH_NAME"'",
            "pr_number": '"${PR_NUMBER:-0}"',
            "pr_creator": "'"${PR_CREATOR:-unknown}"'",
            "run_timestamp": "'"${RUN_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"'",
            "is_error": true,
            "error_message": "'"$ERROR_MSG_SAFE"'",
            "error_step": "'"$ERROR_STEP"'",
            "job_status": "'"$JOB_STATUS"'"
          }' \
          --max-time 10 \
          --show-error \
          -w "\nHTTP_STATUS:%{http_code}" \
          2>&1 || echo "⚠️  Failed to report error to Backstage (non-critical, continuing...)")

        echo "🔍 DEBUG: Backstage response:"
        echo "$BACKSTAGE_RESPONSE"

        echo "✅ Error reporting completed (or skipped if unavailable)"
