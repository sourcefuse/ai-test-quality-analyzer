    - name: Step 4 - Commit and Push Generated Tests
      id: commit_tests
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        REPO_NAME: ${{ github.repository }}
      run: |
        cd "$ACTION_PATH/repo"
        echo "📝 Committing all changes..."

        # Configure git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Create branch name from ticket ID (trim whitespace)
        TICKET_ID=$(echo "$JIRA_TICKET_ID" | xargs)
        BRANCH_NAME="${TICKET_ID}-via-ai-$(date +%Y-%m-%d-%H-%M-%S)"
        echo "Preparing branch: $BRANCH_NAME"

        # Delete branch if it exists on remote
        if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
          echo "❌ Branch exists on remote, deleting it..."
          git push origin --delete "$BRANCH_NAME" || echo "Failed to delete remote branch, continuing..."
        fi

        # Create new branch
        echo "Creating new branch: $BRANCH_NAME"
        git checkout -b "$BRANCH_NAME"

        # Add all changes
        git add .

        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo ""
          echo "=========================================="
          echo "🎉 CONGRATULATIONS!"
          echo "=========================================="
          echo ""
          echo "✅ All unit test cases are already properly created!"
          echo "✅ The codebase has complete test coverage for this ticket."
          echo ""
          echo "📋 JIRA Ticket: $JIRA_TICKET_ID"
          echo "🎯 No new tests required - feature is production-ready!"
          echo ""

          # DEBUG: Show analysis folder contents
          echo "🔍 [DEBUG] Checking analysis folder for ExistingTestCases.md"
          echo "   ACTION_PATH: $ACTION_PATH"
          echo "   ANALYSIS_FOLDER: $ANALYSIS_FOLDER"
          echo "   Expected file: $ACTION_PATH/$ANALYSIS_FOLDER/ExistingTestCases.md"
          echo ""
          echo "📂 [DEBUG] Contents of analysis folder:"
          if [ -d "$ACTION_PATH/$ANALYSIS_FOLDER" ]; then
            ls -lah "$ACTION_PATH/$ANALYSIS_FOLDER"
          else
            echo "   ⚠️ Analysis folder not found: $ACTION_PATH/$ANALYSIS_FOLDER"
          fi
          echo ""

          # Display existing test cases from the generated report
          EXISTING_TESTS_FILE="$ACTION_PATH/$ANALYSIS_FOLDER/ExistingTestCases.md"

          if [ -f "$EXISTING_TESTS_FILE" ]; then
            echo "📝 Existing Test Coverage Report:"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cat "$EXISTING_TESTS_FILE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "📊 For detailed test coverage, check Confluence report"
          else
            echo "⚠️  ExistingTestCases.md not found - showing file list fallback"
            echo ""

            # Fallback: List test files
            echo "📝 Existing Unit Test Files:"
            echo ""

            TEST_FILES=$(find . -type f \( \
              -name "*.test.ts" -o -name "*.spec.ts" -o \
              -name "*.test.js" -o -name "*.spec.js" -o \
              -name "*.test.tsx" -o -name "*.spec.tsx" -o \
              -name "*.test.jsx" -o -name "*.spec.jsx" \
            \) -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/dist/*" -not -path "*/build/*" | sort)

            if [ -n "$TEST_FILES" ]; then
              TEST_COUNT=$(echo "$TEST_FILES" | wc -l | xargs)
              echo "   Found $TEST_COUNT test file(s):"
              echo ""
              echo "$TEST_FILES" | sed 's|^\./||' | while read -r file; do
                FILE_SIZE=$(du -h "$file" 2>/dev/null | cut -f1)
                echo "   ✓ $file ($FILE_SIZE)"
              done
            else
              echo "   ⚠️  No test files found in standard locations"
            fi
            echo ""
          fi

          echo ""
          echo "=========================================="
          echo ""
          echo "branch_name=" >> $GITHUB_OUTPUT
          echo "branch_url=" >> $GITHUB_OUTPUT
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          # Commit all changes
          git commit -m "test: generate unit tests for $JIRA_TICKET_ID

          Generated comprehensive unit test cases using AI based on JIRA requirements and Confluence documentation.

          JIRA Ticket: $JIRA_TICKET_ID
          Target Branch: $TARGET_BRANCH

          🤖 Generated via GitHub Actions"

          # Push to remote
          echo "⬆️  Pushing branch to remote..."
          git push -u origin "$BRANCH_NAME"

          # Generate branch URL
          BRANCH_URL="https://github.com/$REPO_NAME/tree/$BRANCH_NAME"

          echo "✅ All changes committed and pushed to branch: $BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "branch_url=$BRANCH_URL" >> $GITHUB_OUTPUT
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Step 5 - Upload to Confluence with Branch URL
      id: upload_confluence
      if: inputs.upload_to_confluence == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH_URL: ${{ steps.commit_tests.outputs.branch_url }}
        BRANCH_NAME: ${{ steps.commit_tests.outputs.branch_name }}
      run: |
        cd "$ACTION_PATH"
        echo "📤 Uploading results to Confluence with branch URL..."
        # npm run upload-requirements

        # Pass branch URL as environment variable to the upload script
        OUTPUT=$(npm run upload-requirements 2>&1)
        echo "$OUTPUT"

        # Extract Confluence URL from output (now returns full URL from service)
        # Try new parseable format first
        CONFLUENCE_URL="$(echo "$OUTPUT" | grep -oP '^CONFLUENCE_PAGE_URL=\K.*' | head -1 | xargs)"

        # Fallback: try old format with leading spaces
        if [ -z "$CONFLUENCE_URL" ]; then
          CONFLUENCE_URL="$(echo "$OUTPUT" | grep -oP '^\s*URL:\s*\K.*' | head -1 | xargs)"
        fi

        # Fallback: try without leading space requirement
        if [ -z "$CONFLUENCE_URL" ]; then
          CONFLUENCE_URL="$(echo "$OUTPUT" | grep -oP 'URL:\s*\K.*' | head -1 | xargs)"
        fi

        if [ -n "$CONFLUENCE_URL" ]; then
          echo "confluence_url=$CONFLUENCE_URL" >> $GITHUB_OUTPUT
          echo "✅ Results uploaded to Confluence"
          echo "📄 Confluence URL: $CONFLUENCE_URL"
          echo "✅ Branch link included: $BRANCH_URL"
        else
          echo "confluence_url=" >> $GITHUB_OUTPUT
          echo "⚠️  Could not extract Confluence URL from output"
          echo "✅ Results uploaded to Confluence"
        fi

    - name: Step 6 - Create Pull Request
      id: create_pr
      if: steps.commit_tests.outputs.has_changes == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        BRANCH_NAME: ${{ steps.commit_tests.outputs.branch_name }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        JIRA_URL: ${{ inputs.jira_url }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
      run: |
        cd "$ACTION_PATH/repo"
        TICKET_ID=$(echo "$JIRA_TICKET_ID" | xargs)

        echo "🔀 Creating Pull Request..."
        echo "   Source: $BRANCH_NAME"
        echo "   Target: $TARGET_BRANCH"

        # Check if PR already exists
        EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base "$TARGET_BRANCH" --json number,url --jq '.[0]' 2>/dev/null || echo "")

        if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
          PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
          PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
          echo "📝 Pull Request already exists: #$PR_NUMBER"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_action=updated" >> $GITHUB_OUTPUT
        else
          # Create new PR
          PR_BODY="## Summary
        - Generated unit test cases for JIRA ticket: $TICKET_ID
        - AI-powered test generation based on JIRA requirements and Confluence documentation

        ## Test Plan
        - [ ] Review generated test cases
        - [ ] Run tests locally to verify functionality
        - [ ] Check test coverage

        ## Links
        - **JIRA Ticket:** [$TICKET_ID]($JIRA_URL/browse/$TICKET_ID)
        - **Confluence Report:** $CONFLUENCE_URL

        ---
        🤖 _Generated via GitHub Actions - Unit Test Generation Workflow_"

          PR_RESULT=$(gh pr create \
            --title "test($TICKET_ID): add AI-generated unit tests" \
            --body "$PR_BODY" \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH_NAME" 2>&1) || true

          if echo "$PR_RESULT" | grep -q "https://"; then
            PR_URL=$(echo "$PR_RESULT" | grep -oE 'https://[^ ]+')
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
            echo "✅ Pull Request created: $PR_URL"
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_action=created" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Could not create PR: $PR_RESULT"
            echo "pr_url=" >> $GITHUB_OUTPUT
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "pr_action=none" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Skip PR Creation
      id: skip_pr
      if: steps.commit_tests.outputs.has_changes != 'true'
      shell: bash
      run: |
        echo "ℹ️ No changes to commit, skipping PR creation"
        echo "pr_url=" >> $GITHUB_OUTPUT
        echo "pr_number=" >> $GITHUB_OUTPUT
        echo "pr_action=none" >> $GITHUB_OUTPUT

    - name: Generate summary
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH_NAME: ${{ steps.commit_tests.outputs.branch_name }}
        BRANCH_URL: ${{ steps.commit_tests.outputs.branch_url }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        PR_ACTION: ${{ steps.create_pr.outputs.pr_action }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        JIRA_URL: ${{ inputs.jira_url }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
      run: |
        cd "$ACTION_PATH"
        ANALYSIS_FOLDER_VAL="$ANALYSIS_FOLDER"
        COST_REQUIREMENT_VAL="$COST_REQUIREMENT"
        COST_GENERATION_VAL="$COST_GENERATION"
        TOTAL_CLAUDE_COST_VAL="$TOTAL_CLAUDE_COST"

        echo "## 🎉 Unit Test Generation Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**JIRA Ticket:** $JIRA_TICKET_ID" >> $GITHUB_STEP_SUMMARY
        echo "**Target Branch:** $TARGET_BRANCH" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Check if there were changes or not
        if [ -n "$BRANCH_NAME" ]; then
          echo "✅ **Status:** Tests generated and pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🌿 Generated Branch" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Name:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch URL:** [View Branch]($BRANCH_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ **Status:** All unit tests already exist - Production Ready!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 🎉 No changes required! The codebase already has complete test coverage for this ticket." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if ExistingTestCases.md exists and display details
          EXISTING_TESTS_FILE="$ACTION_PATH/$ANALYSIS_FOLDER/ExistingTestCases.md"

          if [ -f "$EXISTING_TESTS_FILE" ]; then
            echo "### 📝 Existing Test Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract summary stats from the file (look for table rows)
            RELEVANT_FILES=$(grep -oP '(?<=JIRA-Relevant Test Files \| )\d+' "$EXISTING_TESTS_FILE" || echo "0")
            OTHER_FILES=$(grep -oP '(?<=Other Test Files \| )\d+' "$EXISTING_TESTS_FILE" || echo "0")
            RELEVANT_CASES=$(grep -oP '(?<=Total Test Cases \(JIRA-Relevant\) \| )\d+' "$EXISTING_TESTS_FILE" || echo "0")
            TOTAL_CASES=$(grep -oP '(?<=Total Test Cases \(Repository-Wide\) \| )\d+' "$EXISTING_TESTS_FILE" || echo "0")

            echo "**Summary:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **JIRA-Relevant Test Files:** $RELEVANT_FILES" >> $GITHUB_STEP_SUMMARY
            echo "- **Other Test Files:** $OTHER_FILES" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Test Cases (JIRA-Relevant):** $RELEVANT_CASES" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Test Cases (Repository-Wide):** $TOTAL_CASES" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Show detailed report in collapsible section (limited to first 500 lines to avoid summary truncation)
            echo "<details>" >> $GITHUB_STEP_SUMMARY
            echo "<summary><b>📊 View Detailed Test Coverage Report</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Check file size (GitHub Actions summary limit is 1024 KB)
            FILE_SIZE=$(wc -c < "$EXISTING_TESTS_FILE")
            FILE_LINES=$(wc -l < "$EXISTING_TESTS_FILE")

            echo '```markdown' >> $GITHUB_STEP_SUMMARY
            if [ "$FILE_LINES" -gt 500 ]; then
              echo "⚠️ Report truncated to first 500 lines (full report available in Confluence)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              head -500 "$EXISTING_TESTS_FILE" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "... ($(($FILE_LINES - 500)) more lines - see Confluence for full report)" >> $GITHUB_STEP_SUMMARY
            else
              cat "$EXISTING_TESTS_FILE" >> $GITHUB_STEP_SUMMARY
            fi
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          else
            # Fallback: List test files if ExistingTestCases.md not found
            cd "$ACTION_PATH/repo"
            echo "### 📝 Existing Unit Test Files" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ _ExistingTestCases.md not found - showing file list fallback_" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            TEST_FILES=$(find . -type f \( \
              -name "*.test.ts" -o -name "*.spec.ts" -o \
              -name "*.test.js" -o -name "*.spec.js" -o \
              -name "*.test.tsx" -o -name "*.spec.tsx" -o \
              -name "*.test.jsx" -o -name "*.spec.jsx" \
            \) -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/dist/*" -not -path "*/build/*" | sort)

            if [ -n "$TEST_FILES" ]; then
              TEST_COUNT=$(echo "$TEST_FILES" | wc -l | xargs)
              echo "Found **$TEST_COUNT** test file(s):" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$TEST_FILES" | sed 's|^\./||' >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ No test files found in standard locations" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            cd "$ACTION_PATH"
          fi
        fi

        echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # Add JIRA link (ensure absolute URL)
        JIRA_BASE="$JIRA_URL"
        # Add https:// if not present
        if [[ ! "$JIRA_BASE" =~ ^https?:// ]]; then
          JIRA_BASE="https://${JIRA_BASE}"
        fi
        JIRA_LINK="${JIRA_BASE}/browse/$JIRA_TICKET_ID"
        echo "- **JIRA Ticket:** [$JIRA_TICKET_ID](${JIRA_LINK})" >> $GITHUB_STEP_SUMMARY

        # Add PR link if available
        if [ -n "$PR_URL" ]; then
          if [ "$PR_ACTION" == "created" ]; then
            echo "- **Pull Request:** [#${PR_NUMBER}](${PR_URL}) (newly created)" >> $GITHUB_STEP_SUMMARY
          elif [ "$PR_ACTION" == "updated" ]; then
            echo "- **Pull Request:** [#${PR_NUMBER}](${PR_URL}) (existing)" >> $GITHUB_STEP_SUMMARY
          fi
        fi

        # Add Confluence link if upload was successful
        if [ -n "$CONFLUENCE_URL" ]; then
          # Trim whitespace from URL to ensure proper markdown formatting
          CONFLUENCE_URL_TRIMMED="$(echo "$CONFLUENCE_URL" | xargs)"
          echo "- **Confluence Report:** [View Analysis Report](${CONFLUENCE_URL_TRIMMED})" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📁 Analysis Folder" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "$ANALYSIS_FOLDER_VAL" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 💰 Claude Usage Cost" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Model:** $ANTHROPIC_MODEL" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Step | Cost |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| Requirements Generation | \$${COST_REQUIREMENT_VAL:-0.00} |" >> $GITHUB_STEP_SUMMARY
        echo "| Test Cases Generation | \$${COST_GENERATION_VAL:-0.00} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Total** | **\$${TOTAL_CLAUDE_COST_VAL:-0.00}** |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "### 📝 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -n "$BRANCH_NAME" ]; then
          # Steps when new tests were generated
          echo "1. 🔍 Review the generated tests in the branch" >> $GITHUB_STEP_SUMMARY
          if [ -n "$PR_URL" ]; then
            echo "2. 🔀 Review and merge the Pull Request" >> $GITHUB_STEP_SUMMARY
          else
            echo "2. 🔀 Create a Pull Request to merge into \`$TARGET_BRANCH\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "3. 📊 Check Confluence for detailed analysis report" >> $GITHUB_STEP_SUMMARY
          echo "4. ✅ Run tests locally to verify functionality" >> $GITHUB_STEP_SUMMARY
        else
          # Steps when tests already exist
          echo "1. 📊 Review the Confluence analysis report" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ Verify existing test coverage meets requirements" >> $GITHUB_STEP_SUMMARY
          echo "3. 🎯 Proceed with deployment - feature is production-ready!" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🤖 _Generated via GitHub Actions - Unit Test Generation Workflow_" >> $GITHUB_STEP_SUMMARY

    - name: Report to Backstage Unit Test Generation Tracker
      if: always()
      shell: bash
      env:
        HAS_CHANGES: ${{ steps.commit_tests.outputs.has_changes }}
        BRANCH_NAME: ${{ steps.commit_tests.outputs.branch_name }}
        BRANCH_URL: ${{ steps.commit_tests.outputs.branch_url }}
        PR_NUMBER: ${{ steps.create_pr.outputs.pr_number || steps.skip_pr.outputs.pr_number }}
        PR_URL: ${{ steps.create_pr.outputs.pr_url || steps.skip_pr.outputs.pr_url }}
        PR_ACTION: ${{ steps.create_pr.outputs.pr_action || steps.skip_pr.outputs.pr_action }}
        AI_TYPE: ${{ inputs.ai_type }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        TOTAL_COST: ${{ env.TOTAL_CLAUDE_COST }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        REPO_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        WORKFLOW_ACTOR: ${{ github.actor }}
        RUN_TIMESTAMP: ${{ github.event.created_at }}
      run: |
        echo "📊 Reporting test generation metrics to Backstage..."

        # Determine generation status
        if [ "$HAS_CHANGES" == "true" ]; then
          GENERATION_STATUS="success"
        elif [ "$HAS_CHANGES" == "false" ]; then
          GENERATION_STATUS="no_changes"
        else
          GENERATION_STATUS="error"
        fi

        # Determine model name and provider based on ai_type
        if [ "$AI_TYPE" == "1" ]; then
          MODEL_NAME="${ANTHROPIC_MODEL:-sonnet[1m]}"
          AI_PROVIDER="aws_bedrock"
        else
          MODEL_NAME="glm-4-plus"
          AI_PROVIDER="glm"
        fi

        # Use actual cost from generation steps (defaults to 0 if not available)
        ACTUAL_COST="${TOTAL_COST:-0}"
        echo "💰 Total AI Cost: \$$ACTUAL_COST"

        # Send data to Backstage (|| true ensures this doesn't fail the workflow)
        curl -X POST https://sf-portal.sourcef.us/api/unit-test-generation-tracker/record \
          -H "Content-Type: application/json" \
          -d '{
            "repo_name": "'"$REPO_NAME"'",
            "runner_id": "'"$RUN_ID"'",
            "workflow_run_number": '"${RUN_NUMBER:-0}"',
            "jira_ticket_id": "'"$JIRA_TICKET_ID"'",
            "generation_status": "'"$GENERATION_STATUS"'",
            "has_changes": '"${HAS_CHANGES:-false}"',
            "branch_name": "'"$BRANCH_NAME"'",
            "branch_url": "'"$BRANCH_URL"'",
            "pr_number": '"${PR_NUMBER:-0}"',
            "pr_url": "'"$PR_URL"'",
            "pr_action": "'"$PR_ACTION"'",
            "target_branch": "'"$TARGET_BRANCH"'",
            "model_name": "'"$MODEL_NAME"'",
            "ai_provider": "'"$AI_PROVIDER"'",
            "ai_cost": '"${ACTUAL_COST}"',
            "confluence_url": "'"$CONFLUENCE_URL"'",
            "pr_creator": "'"${WORKFLOW_ACTOR:-unknown}"'",
            "run_timestamp": "'"${RUN_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"'"
          }' \
          --max-time 10 \
          --silent \
          --show-error \
          || echo "⚠️  Failed to report to Backstage (non-critical, continuing...)"

        echo "✅ Backstage reporting completed (or skipped if unavailable)"

    - name: Report Failure to Backstage Unit Test Generation Tracker
      if: failure()
      shell: bash
      env:
        HAS_CHANGES: ${{ steps.commit_tests.outputs.has_changes }}
        BRANCH_NAME: ${{ steps.commit_tests.outputs.branch_name }}
        BRANCH_URL: ${{ steps.commit_tests.outputs.branch_url }}
        PR_NUMBER: ${{ steps.create_pr.outputs.pr_number || steps.skip_pr.outputs.pr_number }}
        PR_URL: ${{ steps.create_pr.outputs.pr_url || steps.skip_pr.outputs.pr_url }}
        PR_ACTION: ${{ steps.create_pr.outputs.pr_action || steps.skip_pr.outputs.pr_action }}
        AI_TYPE: ${{ inputs.ai_type }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        TOTAL_COST: ${{ env.TOTAL_CLAUDE_COST }}
        CONFLUENCE_URL: ${{ steps.upload_confluence.outputs.confluence_url }}
        JIRA_TICKET_ID: ${{ inputs.jira_ticket_id }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        REPO_NAME: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_NUMBER: ${{ github.run_number }}
        BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        WORKFLOW_ACTOR: ${{ github.actor }}
        RUN_TIMESTAMP: ${{ github.event.created_at }}
        JOB_STATUS: ${{ job.status }}
      run: |
        echo "📊 Reporting workflow failure to Backstage..."

        # Determine model name and provider based on ai_type
        if [ "$AI_TYPE" == "1" ]; then
          MODEL_NAME="${ANTHROPIC_MODEL:-sonnet[1m]}"
          AI_PROVIDER="aws_bedrock"
        else
          MODEL_NAME="glm-4-plus"
          AI_PROVIDER="glm"
        fi

        # On error, send blank values for optional fields
        ACTUAL_COST=""
        BRANCH_NAME_VAL=""
        BRANCH_URL_VAL=""
        PR_URL_VAL=""
        CONFLUENCE_URL_VAL=""

        # Determine error message and step
        echo "🔍 DEBUG: Determining error source..."

        # Priority 1: Use captured error from error files (most specific)
        if [ -f "/tmp/workflow_error_message.txt" ]; then
          ERROR_MSG=$(cat /tmp/workflow_error_message.txt)
          ERROR_STEP=$(cat /tmp/workflow_error_step.txt 2>/dev/null || echo "unknown")
          echo "🔍 DEBUG: Using captured error from file"
          echo "🔍 DEBUG: Error Step = $ERROR_STEP"
          echo "🔍 DEBUG: Error Message = $ERROR_MSG"
        # Priority 2: Generic fallback
        else
          ERROR_MSG="Unit test generation workflow failed. Check logs for details."
          ERROR_STEP="workflow"
          echo "🔍 DEBUG: Using generic fallback error"
        fi

        echo ""
        echo "⚠️  Error: $ERROR_MSG"
        echo "💰 Total AI Cost: (blank on error)"
        echo ""

        # Simple escaping for plain text: only escape quotes for JSON string safety
        ERROR_MSG_SAFE=$(echo "$ERROR_MSG" | sed 's/"/\\"/g' | tr '\n' ' ' | tr '\t' ' ')
        echo "🔍 DEBUG: Sending to Backstage:"
        echo "   error_message: $ERROR_MSG_SAFE"
        echo "   error_step: $ERROR_STEP"
        echo "   generation_status: error"
        echo ""

        # Send error data to Backstage (|| true ensures this doesn't fail the workflow)
        echo "🔍 DEBUG: Sending POST to Backstage API..."
        BACKSTAGE_RESPONSE=$(curl -X POST https://sf-portal.sourcef.us/api/unit-test-generation-tracker/record \
          -H "Content-Type: application/json" \
          -d '{
            "repo_name": "'"$REPO_NAME"'",
            "runner_id": "'"$RUN_ID"'",
            "workflow_run_number": '"${RUN_NUMBER:-0}"',
            "jira_ticket_id": "'"$JIRA_TICKET_ID"'",
            "generation_status": "error",
            "has_changes": false,
            "branch_name": "'"$BRANCH_NAME_VAL"'",
            "branch_url": "'"$BRANCH_URL_VAL"'",
            "pr_number": '"${PR_NUMBER:-0}"',
            "pr_url": "'"$PR_URL_VAL"'",
            "pr_action": "none",
            "target_branch": "'"$TARGET_BRANCH"'",
            "model_name": "'"$MODEL_NAME"'",
            "ai_provider": "'"$AI_PROVIDER"'",
            "ai_cost": "'"$ACTUAL_COST"'",
            "confluence_url": "'"$CONFLUENCE_URL_VAL"'",
            "pr_creator": "'"${WORKFLOW_ACTOR:-unknown}"'",
            "run_timestamp": "'"${RUN_TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"'",
            "is_error": true,
            "error_message": "'"$ERROR_MSG_SAFE"'",
            "error_step": "'"$ERROR_STEP"'",
            "job_status": "'"$JOB_STATUS"'"
          }' \
          --max-time 10 \
          --show-error \
          -w "\nHTTP_STATUS:%{http_code}" \
          2>&1 || echo "⚠️  Failed to report error to Backstage (non-critical, continuing...)")

        echo "🔍 DEBUG: Backstage response:"
        echo "$BACKSTAGE_RESPONSE"

        echo "✅ Error reporting completed (or skipped if unavailable)"
