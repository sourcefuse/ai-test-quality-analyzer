name: "Check Unit Test Cases Quality"
description: "Analyze unit test quality against JIRA requirements and generate comprehensive reports"
author: "Vishal Gupta"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  database_host:
    description: "PostgreSQL database host"
    required: false
    default: "localhost"
  database_port:
    description: "PostgreSQL database port"
    required: false
    default: "5432"
  database_name:
    description: "PostgreSQL database name"
    required: false
    default: "postgres-pgvector"
  database_user:
    description: "PostgreSQL database user"
    required: false
    default: "postgres"
  database_password:
    description: "PostgreSQL database password"
    required: false
    default: "admin"
  jira_url:
    description: "JIRA instance URL"
    required: true
  jira_email:
    description: "JIRA user email"
    required: true
  jira_api_token:
    description: "JIRA API token"
    required: true
  jira_ticket_id:
    description: "JIRA ticket ID to analyze (e.g., BB-15690)"
    required: true
  jira_project_key:
    description: "JIRA project key"
    required: true
  confluence_url:
    description: "Confluence instance URL"
    required: true
  confluence_email:
    description: "Confluence user email"
    required: true
  confluence_api_token:
    description: "Confluence API token"
    required: true
  confluence_space_key:
    description: "Confluence space key"
    required: true
  confluence_silent_mode:
    description: "Suppress logging during Confluence page downloads (true/false)"
    required: false
    default: "true"
  current_analysis_path:
    description: "Specific analysis folder to use (optional, auto-generated if not provided)"
    required: false
    default: ""
  repository_url:
    description: "Repository URL to clone for test analysis"
    required: true
  repository_branch:
    description: "Branch name to clone"
    required: false
    default: "main"
  save_to_file:
    description: "Save analysis results to files (true/false)"
    required: false
    default: "true"
  upload_to_confluence:
    description: "Upload results to Confluence (true/false)"
    required: false
    default: "true"
  minimum_score:
    description: "Minimum acceptable test quality score (0-10)"
    required: false
    default: "6.0"
  aws_region_bedrock:
    description: "AWS region for Bedrock service"
    required: false
    default: "us-east-2"
  aws_access_key_bedrock:
    description: "AWS access key for Bedrock authentication"
    required: true
  aws_secret_key_bedrock:
    description: "AWS secret key for Bedrock authentication"
    required: true
  aws_bedrock_model:
    description: "AWS Bedrock model identifier"
    required: false
    default: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
  anthropic_model:
    description: "Anthropic model name for Claude"
    required: false
    default: "sonnet[1m]"
  ai_type:
    description: "AI provider type: 1 = claude_with_bedrock, 2 = claude_with_glm"
    required: false
    default: "1"
  anthropic_base_url:
    description: "Anthropic/GLM base URL (required when ai_type=2)"
    required: false
  anthropic_auth_token:
    description: "Anthropic/GLM auth token (required when ai_type=2)"
    required: false
  base_folder_suffix:
    description: "Base folder suffix for organizing analysis results"
    required: false
    default: "Quality-Check-Via-AI"
  confluence_root_page_suffix:
    description: "Confluence root page suffix for organizing reports"
    required: false
    default: "Quality-Check-Via-AI"
  confluence_upload_url:
    description: "Confluence instance URL for uploading results (if different from fetch URL)"
    required: false
    default: ""
  confluence_upload_email:
    description: "Confluence user email for uploading results (if different from fetch email)"
    required: false
    default: ""
  confluence_upload_api_token:
    description: "Confluence API token for uploading results (if different from fetch token)"
    required: false
    default: ""
  confluence_upload_space_key:
    description: "Confluence space key for uploading results (if different from fetch space)"
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI API key for embeddings (required if USE_POSTGRES_VECTOR_DB is enabled)"
    required: false
    default: ""
  use_postgres_vector_db:
    description: "Enable PostgreSQL Vector Database with pgvector for RAG-based Confluence fetching (true/false)"
    required: false
    default: "true"
  enable_docker_services:
    description: "Enable Docker services (pgvector and Presidio from ghcr.io) - true/false"
    required: false
    default: "true"
  embedding_dimensions:
    description: "Embedding vector dimensions (1536 for OpenAI, 768 for Ollama nomic-embed-text)"
    required: false
    default: "1536"

outputs:
  test_quality_score:
    description: "Test quality score (0-10)"
    value: ${{ steps.extract_score.outputs.score }}
  analysis_path:
    description: "Path to the analysis results folder"
    value: ${{ steps.extract_paths.outputs.analysis_path }}
  requirements_file:
    description: "Path to the requirements file"
    value: ${{ steps.extract_paths.outputs.requirements_file }}
  result_file:
    description: "Path to the result file"
    value: ${{ steps.extract_paths.outputs.result_file }}
  score_passed:
    description: "Whether the score meets the minimum threshold (true/false)"
    value: ${{ steps.check_score.outputs.passed }}
  confluence_url:
    description: "Confluence URL to the uploaded analysis report"
    value: ${{ steps.upload_confluence.outputs.confluence_url }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Validate Required Configuration
      id: validate_config
      shell: bash
      env:
        JIRA_URL: ${{ inputs.jira_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
        CONFLUENCE_URL: ${{ inputs.confluence_url }}
        CONFLUENCE_EMAIL: ${{ inputs.confluence_email }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence_api_token }}
        AWS_REGION: ${{ inputs.aws_region_bedrock }}
        AWS_ACCESS_KEY: ${{ inputs.aws_access_key_bedrock }}
        AWS_SECRET_KEY: ${{ inputs.aws_secret_key_bedrock }}
        AI_TYPE: ${{ inputs.ai_type }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic_auth_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        USE_POSTGRES_VECTOR_DB: ${{ inputs.use_postgres_vector_db }}
      run: |
        echo "============================================================"
        echo "🔍 Validating Required Configuration"
        echo "============================================================"
        MISSING_CONFIGS=()

        # Check JIRA configuration
        [[ -z "$JIRA_URL" ]] && MISSING_CONFIGS+=("jira_url")
        [[ -z "$JIRA_EMAIL" ]] && MISSING_CONFIGS+=("jira_email")
        [[ -z "$JIRA_API_TOKEN" ]] && MISSING_CONFIGS+=("jira_api_token")

        # Check Confluence configuration
        [[ -z "$CONFLUENCE_URL" ]] && MISSING_CONFIGS+=("confluence_url")
        [[ -z "$CONFLUENCE_EMAIL" ]] && MISSING_CONFIGS+=("confluence_email")
        [[ -z "$CONFLUENCE_API_TOKEN" ]] && MISSING_CONFIGS+=("confluence_api_token")

        # Check AI provider configuration based on ai_type
        if [[ "$AI_TYPE" == "1" ]] || [[ -z "$AI_TYPE" ]]; then
          # Claude with Bedrock (default)
          [[ -z "$AWS_REGION" ]] && MISSING_CONFIGS+=("aws_region_bedrock")
          [[ -z "$AWS_ACCESS_KEY" ]] && MISSING_CONFIGS+=("aws_access_key_bedrock")
          [[ -z "$AWS_SECRET_KEY" ]] && MISSING_CONFIGS+=("aws_secret_key_bedrock")
        elif [[ "$AI_TYPE" == "2" ]]; then
          # Claude with GLM
          [[ -z "$ANTHROPIC_BASE_URL" ]] && MISSING_CONFIGS+=("anthropic_base_url")
          [[ -z "$ANTHROPIC_AUTH_TOKEN" ]] && MISSING_CONFIGS+=("anthropic_auth_token")
        fi

        # Check OpenAI API key if PostgreSQL Vector DB is enabled
        if [[ "$USE_POSTGRES_VECTOR_DB" == "true" ]]; then
          [[ -z "$OPENAI_API_KEY" ]] && MISSING_CONFIGS+=("openai_api_key (required for embeddings when use_postgres_vector_db=true)")
        fi

        # Report validation results
        if [ ${#MISSING_CONFIGS[@]} -gt 0 ]; then
          MISSING_FIELDS="${MISSING_CONFIGS[*]}"
          echo "VALIDATION_MISSING_FIELDS=$MISSING_FIELDS" >> $GITHUB_ENV
          echo "============================================================"
          echo "❌ Error occurred:"
          echo "============================================================"
          echo "Message: Missing required configuration parameters"
          echo "Missing fields: $MISSING_FIELDS"
          echo "============================================================"
          echo ""
          echo "Please ensure the following parameters are provided:"
          for config in "${MISSING_CONFIGS[@]}"; do
            echo "  - $config"
          done
          echo ""
          echo "For GitHub Actions workflows, ensure these are set in your workflow file:"
          echo "  Repository secrets: https://github.com/YOUR-ORG/YOUR-REPO/settings/secrets/actions"
          echo "  Action inputs: Check the 'with:' section in your workflow file"
          echo ""
          exit 1
        fi

        echo "✅ All required configuration validated successfully"
        echo "============================================================"
        echo ""

    - name: Set analysis path
      id: set_analysis_path
      shell: bash
      env:
        SPACE_KEY: ${{ inputs.confluence_space_key }}
        BASE_FOLDER_SUFFIX: ${{ inputs.base_folder_suffix }}
        TICKET_ID: ${{ inputs.jira_ticket_id }}
      run: |
        ANALYSIS_PATH="${TICKET_ID}-Via-AI/$(date +'%Y%m%d-%H-%M-%S')-Via-AI"
        echo "CURRENT_ANALYSIS_PATH=$ANALYSIS_PATH" >> $GITHUB_ENV
        echo "analysis_path=$ANALYSIS_PATH" >> $GITHUB_OUTPUT

        # Set ANALYSIS_FOLDER for use in later steps
        ANALYSIS_FOLDER="${SPACE_KEY}-${BASE_FOLDER_SUFFIX}/${ANALYSIS_PATH}"
        echo "ANALYSIS_FOLDER=$ANALYSIS_FOLDER" >> $GITHUB_ENV

        echo "✅ Analysis path set: $ANALYSIS_PATH"
        echo "✅ Analysis folder set: $ANALYSIS_FOLDER"

    - name: Install dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        echo "📦 Installing pnpm and dependencies..."
        npm install -g pnpm
        pnpm install

        echo ""
        echo "🤖 Installing Claude Code CLI globally..."
        npm install -g @anthropic-ai/claude-code

        echo ""
        echo "✅ Verifying Claude CLI installation..."
        if ! command -v claude &> /dev/null; then
          echo "❌ Error: Claude CLI not found in PATH after installation"
          echo "Expected location: $(npm root -g)/@anthropic-ai/claude-code"
          echo "PATH: $PATH"
          exit 1
        fi

        CLAUDE_VERSION=$(claude --version 2>&1 || echo "unknown")
        echo "✅ Claude CLI installed successfully: $CLAUDE_VERSION"

    - name: Test AI Connectivity
      id: test_ai_connectivity
      shell: bash
      env:
        AI_TYPE: ${{ inputs.ai_type }}
        AWS_REGION: ${{ inputs.aws_region_bedrock }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws_access_key_bedrock }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws_secret_key_bedrock }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        AWS_BEDROCK_MODEL: ${{ inputs.aws_bedrock_model }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic_auth_token }}
        CLAUDE_VERBOSE_MODE: false
      run: |
        cd ${{ github.action_path }}
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           🔌 TESTING AI CONNECTIVITY                         ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""
        echo "🔍 DEBUG: Environment Check"
        echo "   AI Type: ${AI_TYPE} (1=Bedrock, 2=GLM)"
        echo "   AWS Region: ${AWS_REGION:-not set}"
        echo "   AWS Access Key: ${AWS_ACCESS_KEY_ID:0:10}... (masked)"
        echo "   Bedrock Model: ${AWS_BEDROCK_MODEL:-not set}"
        echo "   GLM Base URL: ${ANTHROPIC_BASE_URL:-not set}"
        echo "   Claude Verbose: ${CLAUDE_VERBOSE_MODE:-not set}"
        echo ""
        echo "📡 Testing Claude API connection with simple prompt..."
        echo ""

        # Test with a simple "Hi" prompt
        echo "🔍 DEBUG: Running 'pnpm run test-ai-connection'..."
        set +e
        TEST_OUTPUT=$(pnpm run test-ai-connection 2>&1)
        TEST_EXIT_CODE=$?
        set -e

        echo "$TEST_OUTPUT"
        echo ""
        echo "🔍 DEBUG: Exit Code = $TEST_EXIT_CODE"

        if [ $TEST_EXIT_CODE -ne 0 ]; then
          echo ""
          echo "❌ AI connectivity test FAILED"
          echo ""
          echo "🔍 DEBUG: Extracting error message from output..."

          # Extract error from JSON output or plain text
          ERROR_MSG=$(echo "$TEST_OUTPUT" | grep -o '"result":"[^"]*"' | sed 's/"result":"//;s/"$//' | head -1)
          echo "🔍 DEBUG: Extracted from JSON result field: '$ERROR_MSG'"

          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG=$(echo "$TEST_OUTPUT" | tail -20 | grep -E "Error:|error:|❌|failed|Failed|Exception|403|401|500" | head -2 | tr '\n' ' ')
            echo "🔍 DEBUG: Extracted from error indicators: '$ERROR_MSG'"
          fi

          # Clean ANSI codes and remove ALL JSON characters: { } " \ : ,
          ERROR_MSG_RAW="$ERROR_MSG"
          ERROR_MSG=$(echo "$ERROR_MSG" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/\x1b\[//g' | sed 's/[{}":,\\]//g' | tr -s ' ' | cut -c1-450 | sed 's/^ *//;s/ *$//')
          echo "🔍 DEBUG: After cleaning: '$ERROR_MSG'"

          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="Unable to communicate with Claude API"
            echo "🔍 DEBUG: Using fallback error message"
          fi

          # Add context about which service is failing
          if [[ "$AI_TYPE" == "1" ]] || [[ -z "$AI_TYPE" ]]; then
            CONTEXT_PREFIX="[AWS Bedrock]"
            echo "🔍 DEBUG: Provider = AWS Bedrock (ai_type=${AI_TYPE:-default})"
          else
            CONTEXT_PREFIX="[GLM]"
            echo "🔍 DEBUG: Provider = GLM (ai_type=$AI_TYPE)"
          fi
          ERROR_MSG="${CONTEXT_PREFIX} ${ERROR_MSG}"

          echo ""
          echo "❌ FINAL ERROR MESSAGE:"
          echo "   $ERROR_MSG"
          echo ""
          echo "Common issues:"
          echo "  • Invalid AWS credentials (ai_type=1)"
          echo "  • Incorrect AWS region or Bedrock model ID"
          echo "  • GLM endpoint unreachable or invalid auth token (ai_type=2)"
          echo "  • Network connectivity issues"
          echo ""

          # Export simplified error for Backstage reporting (use file since $GITHUB_ENV doesn't persist across failing steps)
          echo "🔍 DEBUG: Writing error to /tmp/workflow_error_message.txt"
          echo "$ERROR_MSG" > /tmp/workflow_error_message.txt
          echo "ai_connectivity_test" > /tmp/workflow_error_step.txt
          echo "🔍 DEBUG: Error file contents: $(cat /tmp/workflow_error_message.txt)"

          exit 1
        fi

        echo ""
        echo "✅ AI connectivity test PASSED - Claude API is reachable and responding"
        echo "============================================================"
        echo ""

    - name: Debug - Print Configuration
      shell: bash
      run: |
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           🔧 CONFIGURATION DEBUG INFO                        ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""
        echo "📋 JIRA Configuration:"
        echo "   JIRA Ticket ID: ${{ inputs.jira_ticket_id }}"
        echo "   JIRA Project Key: ${{ inputs.jira_project_key }}"
        echo ""
        echo "📄 Confluence Configuration:"
        echo "   Confluence Space Key: ${{ inputs.confluence_space_key }}"
        echo ""
        echo "🤖 AI Configuration:"
        echo "   AI Type: ${{ inputs.ai_type }} (1=Bedrock, 2=GLM)"
        if [ "${{ inputs.ai_type }}" == "2" ]; then
          echo "   ✅ Using GLM (Anthropic API)"
          echo "   Anthropic Base URL: ${{ inputs.anthropic_base_url && '***configured***' || 'not set' }}"
          echo "   Anthropic Model: ${{ inputs.anthropic_model || 'default' }}"
        else
          echo "   ✅ Using AWS Bedrock"
          echo "   AWS Region: ${{ inputs.aws_region_bedrock || 'not set' }}"
          echo "   Bedrock Model: ${{ inputs.aws_bedrock_model || 'default' }}"
        fi
        echo ""
        echo "🐘 PostgreSQL Configuration:"
        echo "   Use PostgreSQL Vector DB: ${{ inputs.use_postgres_vector_db }}"
        echo "   Database Host: ${{ inputs.database_host }}"
        echo "   Database Name: ${{ inputs.database_name }}"
        echo "   Embedding Dimensions: ${{ inputs.embedding_dimensions }}"
        echo ""
        echo "🐳 Docker Configuration:"
        echo "   Enable Docker Services: ${{ inputs.enable_docker_services }}"
        echo ""
        echo "📊 Analysis Configuration:"
        echo "   Minimum Score: ${{ inputs.minimum_score }}"
        echo "   Upload to Confluence: ${{ inputs.upload_to_confluence }}"
        echo "   Save to File: ${{ inputs.save_to_file }}"
        echo ""
        echo "═══════════════════════════════════════════════════════════════"

    - name: Login to GitHub Container Registry
      if: inputs.enable_docker_services == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        # 🔒 Security: Use env var for github.actor to prevent command injection
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        echo "🐳 Logging in to GitHub Container Registry..."
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Setup PostgreSQL Database
      if: inputs.database_host == 'localhost' && inputs.enable_docker_services == 'true'
      shell: bash
      env:
        DB_USER: ${{ inputs.database_user }}
        DB_PASSWORD: ${{ inputs.database_password }}
        DB_NAME: ${{ inputs.database_name }}
        DB_PORT: ${{ inputs.database_port }}
      run: |
        echo "🐘 Setting up PostgreSQL database..."

        # Pull PostgreSQL + pgvector image from ghcr.io (quiet mode)
        echo "📥 Pulling PostgreSQL + pgvector image from ghcr.io..."
        docker pull -q ghcr.io/sourcefuse/pgvector-rag:latest

        # Start PostgreSQL container
        echo "🚀 Starting PostgreSQL container..."
        docker run -d \
          --name postgres-pgvector \
          -e POSTGRES_USER="$DB_USER" \
          -e POSTGRES_PASSWORD="$DB_PASSWORD" \
          -e POSTGRES_DB="$DB_NAME" \
          -p "${DB_PORT}:5432" \
          ghcr.io/sourcefuse/pgvector-rag:latest

        # Wait for PostgreSQL to be ready
        echo "⏳ Waiting for PostgreSQL to be ready..."
        sleep 10

        # Verify PostgreSQL is running
        echo "✅ PostgreSQL setup complete"
        docker ps | grep postgres-pgvector

    - name: Start Presidio services
      if: inputs.enable_docker_services == 'true'
      shell: bash
      run: |
        echo "📥 Pulling Presidio images from ghcr.io (quiet mode)..."
        docker pull -q ghcr.io/sourcefuse/presidio-analyzer:latest &
        docker pull -q ghcr.io/sourcefuse/presidio-anonymizer:latest &
        wait
        echo "✅ Presidio images pulled successfully"

        echo "🚀 Starting Presidio Analyzer (port 5002)..."
        docker run -d \
          --name presidio-analyzer \
          -p 5002:3000 \
          -e PORT=3000 \
          ghcr.io/sourcefuse/presidio-analyzer:latest

        echo "🚀 Starting Presidio Anonymizer (port 5001)..."
        docker run -d \
          --name presidio-anonymizer \
          -p 5001:3000 \
          -e PORT=3000 \
          ghcr.io/sourcefuse/presidio-anonymizer:latest

        echo "⏳ Waiting for services to be ready..."
        sleep 15

        echo "🔍 Testing Presidio services availability..."

        # Wait up to 120 seconds for Presidio Analyzer to be ready (spaCy model loading takes time)
        MAX_WAIT=120
        ELAPSED=0
        ANALYZER_READY=false

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          if curl -s http://localhost:5002/health --max-time 5 | grep -q "Presidio"; then
            ANALYZER_READY=true
            echo "✅ Presidio Analyzer is ready (took ${ELAPSED}s)"
            break
          fi
          echo "   ⏳ Waiting for Presidio Analyzer... (${ELAPSED}s/${MAX_WAIT}s)"
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done

        if [ "$ANALYZER_READY" = false ]; then
          echo "⚠️  Presidio Analyzer did not respond within ${MAX_WAIT}s - PII detection will use regex fallback"
        fi

        # Wait up to 60 seconds for Presidio Anonymizer to be ready (no model loading needed)
        MAX_WAIT=60
        ELAPSED=0
        ANONYMIZER_READY=false

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          if curl -s http://localhost:5001/health --max-time 5 | grep -q "Presidio"; then
            ANONYMIZER_READY=true
            echo "✅ Presidio Anonymizer is ready (took ${ELAPSED}s)"
            break
          fi
          echo "   ⏳ Waiting for Presidio Anonymizer... (${ELAPSED}s/${MAX_WAIT}s)"
          sleep 5
          ELAPSED=$((ELAPSED + 5))
        done

        if [ "$ANONYMIZER_READY" = false ]; then
          echo "⚠️  Presidio Anonymizer did not respond within ${MAX_WAIT}s - PII detection will use regex fallback"
        fi

        if [ "$ANALYZER_READY" = true ] && [ "$ANONYMIZER_READY" = true ]; then
          echo "✅ All Presidio services are ready and responding"
        else
          echo "⚠️  Some Presidio services are not ready - application will use regex-based PII detection"
        fi

        echo ""
        echo "📊 Presidio container status:"
        docker ps | grep presidio

    - name: Skip Docker services notification
      if: inputs.enable_docker_services != 'true'
      shell: bash
      run: |
        echo "⚠️  Skipping Docker services setup"
        echo "   enable_docker_services is not set to 'true'"
        echo "   PII detection will use regex-based fallback"

    - name: Clone repository for analysis
      shell: bash
      env:
        # 🔒 Security: Use env vars to prevent command injection
        # Never use ${{ }} directly in bash scripts with untrusted input
        BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        GITHUB_TOKEN: ${{ github.token }}
        REPO_NAME: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        echo "📥 Cloning repository for test analysis..."

        # ✅ SAFE: Sanitize branch name - only allow alphanumeric, hyphen, underscore, slash, dot
        BRANCH=$(echo "$BRANCH_NAME" | tr -cd 'A-Za-z0-9._/-')
        echo "Branch to clone: $BRANCH"

        mkdir -p repo
        cd repo
        git clone --depth 1 --branch "$BRANCH" --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_NAME}.git" .
        echo "✅ Repository cloned successfully (branch: $BRANCH)"

    - name: Create .env file
      shell: bash
      run: |
        cd ${{ github.action_path }}
        cat > .env << EOF
        # Application Configuration
        NODE_ENV=production

        # JIRA Configuration
        JIRA_URL=${{ inputs.jira_url }}
        JIRA_EMAIL=${{ inputs.jira_email }}
        JIRA_API_TOKEN=${{ inputs.jira_api_token }}
        JIRA_TICKET_ID=${{ inputs.jira_ticket_id }}
        JIRA_PROJECT_KEY=${{ inputs.jira_project_key }}
        JIRA_FETCH_FIELDS=summary,description,customfield_10000
        JIRA_MAX_RESULT=100
        JIRA_FILE_NAME=Jira.md

        # Confluence Configuration (for fetching data)
        CONFLUENCE_URL=${{ inputs.confluence_url }}
        CONFLUENCE_EMAIL=${{ inputs.confluence_email }}
        CONFLUENCE_API_TOKEN=${{ inputs.confluence_api_token }}
        CONFLUENCE_SPACE_KEY=${{ inputs.confluence_space_key }}
        CONFLUENCE_SILENT_MODE=${{ inputs.confluence_silent_mode }}
        CONFLUENCE_MAX_PAGES=
        CONFLUENCE_PAGE_LIMIT=50
        CONFLUENCE_FILE_NAME=Confluence.md
        CONFLUENCE_RAG_FILE_NAME=Confluence-Rag.md

        # Confluence Upload Configuration (for uploading results)
        CONFLUENCE_UPLOAD_URL=${{ inputs.confluence_upload_url }}
        CONFLUENCE_UPLOAD_EMAIL=${{ inputs.confluence_upload_email }}
        CONFLUENCE_UPLOAD_API_TOKEN=${{ inputs.confluence_upload_api_token }}
        CONFLUENCE_UPLOAD_SPACE_KEY=${{ inputs.confluence_upload_space_key }}

        # Presidio Configuration (PII Detection)
        PRESIDIO_ANALYZE_URL=http://localhost:5002/analyze
        PRESIDIO_ANONYMIZE_URL=http://localhost:5001/anonymize
        PRESIDIO_TIMEOUT=30000

        # Data Sanitization Configuration
        SANITIZE_PG_DATA=false

        # AI Provider Configuration
        AI_TYPE=${{ inputs.ai_type }}
        ANTHROPIC_BASE_URL=${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH_TOKEN=${{ inputs.anthropic_auth_token }}
        CLAUDE_VERBOSE_MODE=false

        # AWS Bedrock Configuration
        AWS_REGION_BEDROCK=${{ inputs.aws_region_bedrock }}
        AWS_ACCESS_KEY_BEDROCK=${{ inputs.aws_access_key_bedrock }}
        AWS_SECRET_KEY_BEDROCK=${{ inputs.aws_secret_key_bedrock }}
        AWS_BEDROCK_MODEL=${{ inputs.aws_bedrock_model }}
        ANTHROPIC_MODEL=${{ inputs.anthropic_model }}
        BASE_FOLDER_SUFFIX=${{ inputs.base_folder_suffix }}
        CONFLUENCE_ROOT_PAGE_SUFFIX=${{ inputs.confluence_root_page_suffix }}

        # Analysis Configuration
        CURRENT_ANALYSIS_PATH=$CURRENT_ANALYSIS_PATH
        ANALYSIS_FOLDER=$ANALYSIS_FOLDER
        SAVE_TO_FILE=${{ inputs.save_to_file }}

        # File Names Configuration
        REQUIREMENTS_FILE_NAME=Requirements.md
        ANALYSIS_REPORT_FILE_NAME=AnalysisReport.md

        # RAG System Configuration (PostgreSQL + pgvector)
        USE_POSTGRES_VECTOR_DB=${{ inputs.use_postgres_vector_db }}
        DATABASE_HOST=${{ inputs.database_host }}
        DATABASE_PORT=${{ inputs.database_port }}
        DATABASE_NAME=${{ inputs.database_name }}
        DATABASE_USER=${{ inputs.database_user }}
        DATABASE_PASSWORD=${{ inputs.database_password }}

        # OpenAI Embeddings Configuration
        EMBEDDING_PROVIDER=openai
        OPENAI_API_KEY=${{ inputs.openai_api_key }}

        # Performance Configuration
        EMBEDDING_CONCURRENCY=50
        INDEXER_BATCH_SIZE=50
        CHUNK_SIZE=1000
        CHUNK_OVERLAP=200

        # Smart Filter Configuration
        USE_SMART_FILTER=true
        SMART_FILTER_MAX_PAGES=30
        SMART_FILTER_MIN_SCORE=0.3
        SMART_FILTER_USE_KEYWORDS=true
        SMART_FILTER_USE_TITLE=true
        SMART_FILTER_USE_LABELS=true
        SMART_FILTER_USE_COMPONENTS=true
        SMART_FILTER_DEBUG=false
        CHECK_PG_BEFORE_CONFLUENCE_FETCH=true

        EOF
        echo "✅ Environment configuration created"

    - name: Test PostgreSQL Database Connection
      if: inputs.database_host == 'localhost' && inputs.enable_docker_services == 'true'
      shell: bash
      env:
        DB_USER: ${{ inputs.database_user }}
        DB_NAME: ${{ inputs.database_name }}
      run: |
        echo "🔍 Testing PostgreSQL database connection..."

        # Wait a bit more for PostgreSQL to fully initialize
        echo "⏳ Waiting for PostgreSQL to fully initialize..."
        sleep 5

        # Test connection and run sample queries
        echo "📊 Running sample queries..."
        docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT version();"

        echo ""
        echo "📦 Checking pgvector extension..."
        docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -c "CREATE EXTENSION IF NOT EXISTS vector;"
        docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -c "SELECT * FROM pg_extension WHERE extname = 'vector';"

        echo ""
        echo "✅ Database connection test complete!"

    - name: Get cache date key
      id: cache-date
      shell: bash
      run: |
        CACHE_DATE=$(date +'%Y-%m-%d')
        echo "date=$CACHE_DATE" >> $GITHUB_OUTPUT
        echo "📅 Cache date key: $CACHE_DATE"

    - name: Debug - Cache Configuration
      if: inputs.use_postgres_vector_db == 'true' && inputs.database_host == 'localhost'
      shell: bash
      run: |
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           💾 CACHE DEBUG INFO                                ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""
        echo "🔑 Cache Key: pgvector-${{ inputs.confluence_space_key }}-dim${{ inputs.embedding_dimensions }}-${{ steps.cache-date.outputs.date }}"
        echo "📂 Cache Path: /tmp/pgvector-data"
        echo "ℹ️  Cache Policy: Daily rotation (no fallback to older cache)"
        echo "═══════════════════════════════════════════════════════════════"

    - name: Restore PostgreSQL data from cache
      if: inputs.use_postgres_vector_db == 'true' && inputs.database_host == 'localhost'
      id: pgdata-cache
      uses: actions/cache@v4
      with:
        path: /tmp/pgvector-data
        key: pgvector-${{ inputs.confluence_space_key }}-dim${{ inputs.embedding_dimensions }}-${{ steps.cache-date.outputs.date }}

    - name: Debug - Cache Restore Result
      if: inputs.use_postgres_vector_db == 'true' && inputs.database_host == 'localhost'
      shell: bash
      run: |
        echo "📦 Cache Restore Result:"
        echo "   Cache Hit: ${{ steps.pgdata-cache.outputs.cache-hit || 'false' }}"
        if [ -f /tmp/pgvector-data/pgdump.sql ]; then
          CACHE_SIZE=$(ls -lh /tmp/pgvector-data/pgdump.sql | awk '{print $5}')
          echo "   Cache File Found: ✅ Yes"
          echo "   Cache File Size: $CACHE_SIZE"
        else
          echo "   Cache File Found: ❌ No"
        fi

    - name: Load PostgreSQL data from cache
      if: inputs.database_host == 'localhost'
      id: load-cache
      shell: bash
      env:
        DB_USER: ${{ inputs.database_user }}
        DB_NAME: ${{ inputs.database_name }}
      run: |
        echo "📦 Checking for cached PostgreSQL data..."
        if [ -f /tmp/pgvector-data/pgdump.sql ]; then
          # Truncate existing tables before restore (schema already exists from init scripts)
          echo "🗑️  Clearing existing data..."
          docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -c "TRUNCATE TABLE document_chunks, confluence_documents CASCADE;" 2>/dev/null || true

          # Restore the data-only dump (ignore errors for schema objects)
          echo "📥 Restoring data from cache..."
          docker exec -i postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" --set ON_ERROR_STOP=off < /tmp/pgvector-data/pgdump.sql 2>/dev/null || true

          # Verify restoration
          DOC_COUNT=$(docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT COUNT(*) FROM confluence_documents;" 2>/dev/null || echo "0")
          DOC_COUNT=$(echo "$DOC_COUNT" | tr -d ' ')

          CHUNK_COUNT=$(docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT COUNT(*) FROM document_chunks;" 2>/dev/null || echo "0")
          CHUNK_COUNT=$(echo "$CHUNK_COUNT" | tr -d ' ')

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           📊 CACHE LOAD RESULT                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "   Documents Restored: $DOC_COUNT"
          echo "   Chunks Restored: $CHUNK_COUNT"

          if [ "$DOC_COUNT" -gt 0 ]; then
            echo "   Status: ✅ CACHE HIT - Data loaded successfully"
            echo "   Confluence fetch will be SKIPPED!"
            echo "cache_loaded=true" >> $GITHUB_OUTPUT
          else
            echo "   Status: ⚠️ CACHE MISS - No documents found after restore"
            echo "   Confluence fetch will be REQUIRED"
            echo "cache_loaded=false" >> $GITHUB_OUTPUT
          fi
          echo "═══════════════════════════════════════════════════════════════"
        else
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           📊 CACHE LOAD RESULT                               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "   Status: ⚠️ CACHE MISS - No cache file found"
          echo "   Confluence fetch will be REQUIRED"
          echo "═══════════════════════════════════════════════════════════════"
          echo "cache_loaded=false" >> $GITHUB_OUTPUT
        fi

    - name: Step 1 - Fetch JIRA and Confluence data
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SKIP_CONFLUENCE_FETCH: ${{ steps.load-cache.outputs.cache_loaded }}
      run: |
        cd "$ACTION_PATH"
        echo "🔄 Fetching JIRA ticket and Confluence pages..."
        if [ "$SKIP_CONFLUENCE_FETCH" == "true" ]; then
          echo "   ℹ️  SKIP_CONFLUENCE_FETCH=true (cache loaded)"
        fi
        pnpm run start
        echo "✅ Data fetched successfully"

    - name: Step 2 - Fetch Confluence with RAG
      if: inputs.use_postgres_vector_db == 'true' && steps.load-cache.outputs.cache_loaded != 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        echo "🔄 Fetching Confluence data using RAG-based approach..."
        pnpm run process:jira
        echo "✅ Confluence RAG data fetched successfully"

    - name: Skip Confluence RAG fetch (cache hit)
      if: inputs.use_postgres_vector_db == 'true' && steps.load-cache.outputs.cache_loaded == 'true'
      shell: bash
      run: |
        echo "✅ Skipping Confluence RAG fetch - data loaded from cache"

    - name: Save PostgreSQL data to cache
      if: inputs.use_postgres_vector_db == 'true' && inputs.database_host == 'localhost' && steps.load-cache.outputs.cache_loaded != 'true'
      shell: bash
      env:
        DB_USER: ${{ inputs.database_user }}
        DB_NAME: ${{ inputs.database_name }}
      run: |
        echo "💾 Saving PostgreSQL data to cache..."
        mkdir -p /tmp/pgvector-data

        # Check if table exists and has data
        TABLE_EXISTS=$(docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'confluence_documents');" 2>/dev/null || echo "f")
        TABLE_EXISTS=$(echo "$TABLE_EXISTS" | tr -d ' ')

        if [ "$TABLE_EXISTS" = "t" ]; then
          DOC_COUNT=$(docker exec postgres-pgvector psql -U "$DB_USER" -d "$DB_NAME" -t -c "SELECT COUNT(*) FROM confluence_documents;" 2>/dev/null || echo "0")
          DOC_COUNT=$(echo "$DOC_COUNT" | tr -d ' ')

          if [ "$DOC_COUNT" -gt 0 ]; then
            echo "📊 Found $DOC_COUNT documents to cache"

            # Export data only (schema is created by Docker init scripts)
            docker exec postgres-pgvector pg_dump -U "$DB_USER" -d "$DB_NAME" --data-only --no-owner --no-acl > /tmp/pgvector-data/pgdump.sql

            DUMP_SIZE=$(du -h /tmp/pgvector-data/pgdump.sql | cut -f1)
            echo "✅ PostgreSQL dump created: $DUMP_SIZE"
            echo "   Cache will be saved for next run"
          else
            echo "⚠️  No documents found, skipping cache save"
          fi
        else
          echo "⚠️  Table confluence_documents not found, skipping cache save"
        fi

    - name: Step 3 - Create Requirements document (GLM)
      if: inputs.ai_type == '2'
      id: glm_analysis
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic_auth_token }}
        ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
      run: |
        cd ${{ github.action_path }}
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║           🤖 AI ANALYSIS - GLM (Anthropic API)               ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
        echo ""
        echo "📋 Creating requirements document from JIRA and Confluence..."
        echo "   AI Provider: GLM (Anthropic API)"
        echo "   Base URL: ${ANTHROPIC_BASE_URL:-not set}"
        echo "   Model: ${ANTHROPIC_MODEL:-default}"
        echo ""

        # Capture cost from create-requirement-doc (disable exit-on-error to show output)
        set +e
        OUTPUT1=$(pnpm run create-requirement-doc 2>&1)
        EXIT_CODE1=$?
        set -e
        echo "$OUTPUT1"
        echo ""
        echo "🔍 DEBUG: create-requirement-doc exit code = $EXIT_CODE1"
        echo ""

        if [ $EXIT_CODE1 -ne 0 ]; then
          echo ""
          echo "❌ Requirements document creation failed with exit code $EXIT_CODE1"
          echo "See error output above for details"

          # Extract error message for Backstage reporting
          # Try to extract from Claude JSON output first (handles authentication errors, API errors)
          ERROR_MSG=$(echo "$OUTPUT1" | grep -o '"result":"[^"]*"' | sed 's/"result":"//;s/"$//' | head -1)

          # If no JSON result, try extracting from plain text error indicators
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG=$(echo "$OUTPUT1" | tail -30 | grep -E "Error:|error:|❌|failed|Failed|Exception" | grep -v "disable exit-on-error" | head -3 | tr '\n' ' ')
          fi

          # Clean ANSI codes, remove JSON structures, convert to plain text
          ERROR_MSG=$(echo "$ERROR_MSG" | sed 's/\x1b\[[0-9;]*m//g' | sed 's/\x1b\[//g')

          # Convert JSON to plain text: remove formatting characters but keep message content
          ERROR_MSG=$(echo "$ERROR_MSG" | sed 's/[{}":,\\]//g' | tr -s ' ')

          # Truncate and trim
          ERROR_MSG=$(echo "$ERROR_MSG" | cut -c1-500 | sed 's/^ *//;s/ *$//')

          # Final fallback
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="Requirements document creation failed with exit code $EXIT_CODE1. Check workflow logs for details."
          fi

          # Write simplified error to file for Backstage reporting ($GITHUB_ENV doesn't persist across failing steps)
          echo "$ERROR_MSG" > /tmp/workflow_error_message.txt
          echo "create-requirement-doc" > /tmp/workflow_error_step.txt

          exit 1
        fi

        # Extract cost (disable exit-on-error for grep to prevent script exit if not found)
        set +e
        COST1=$(echo "$OUTPUT1" | grep "💰 Cost:" | grep -oE "\$[0-9]+\.[0-9]+" | sed 's/\$//' | tail -1)
        set -e
        COST1=${COST1:-0}
        echo "✅ Requirements document created (Cost: \$$COST1)"
        echo ""

        echo "🔍 Analyzing unit test quality..."
        set +e
        OUTPUT2=$(pnpm run analyze-test-quality 2>&1)
        EXIT_CODE2=$?
        set -e
        echo "$OUTPUT2"
        echo ""
        echo "🔍 DEBUG: analyze-test-quality exit code = $EXIT_CODE2"
        echo ""

        if [ $EXIT_CODE2 -ne 0 ]; then
          echo ""
          echo "❌ Test quality analysis failed with exit code $EXIT_CODE2"
          echo "See error output above for details"

          # Extract error message for Backstage reporting
          ERROR_MSG=$(echo "$OUTPUT2" | tail -20 | grep -E "Error:|error:|❌|failed|Failed|Exception" | head -3 | tr '\n' ' ' | sed 's/["\x1b\[]//g' | sed 's/\[0m//g' | cut -c1-500)
          if [ -z "$ERROR_MSG" ]; then
            ERROR_MSG="Test quality analysis failed with exit code $EXIT_CODE2. Check workflow logs for details."
          fi
          # Write error to file for Backstage reporting ($GITHUB_ENV doesn't persist across failing steps)
          echo "$ERROR_MSG" > /tmp/workflow_error_message.txt
          echo "analyze-test-quality" > /tmp/workflow_error_step.txt

          exit 1
        fi

        # Extract cost (disable exit-on-error for grep to prevent script exit if not found)
        set +e
        COST2=$(echo "$OUTPUT2" | grep "💰 Cost:" | grep -oE "\$[0-9]+\.[0-9]+" | sed 's/\$//' | tail -1)
        set -e
        COST2=${COST2:-0}
        echo "✅ Test quality analysis completed (Cost: \$$COST2)"

        # Calculate total cost
        TOTAL_COST=$(awk -v c1="$COST1" -v c2="$COST2" 'BEGIN { printf "%.4f", c1 + c2 }')
        echo ""
        echo "💰 Total AI Cost: \$$TOTAL_COST"
        echo "total_cost=$TOTAL_COST" >> $GITHUB_OUTPUT
        echo "═══════════════════════════════════════════════════════════════"

